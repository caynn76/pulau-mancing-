<title>Pulau 3</title>
<!--
PULAU 3 (TEMA JEPANG) - TAHAP 2A: sambungan ke game utama. Halaman terpisah di domain yang sama dengan index.html.
2A: gerbang GM, login dari pm-au (sama dengan game utama), presence i=3 di /island, tombol kembali. Save TIDAK ditulis di halaman ini (hanya dibaca).
Bahan di bawah ini berasal dari prototipe 1B+1C (varian C, petak 32 px):
1B: gerak halus, tangga lebih lambat dengan langkah naik, tabrakan menggeser di sudut.
1C: kamera halus, bayangan panjang, tebing berdetail, sungai, air terjun, jembatan merah, tiang listrik dan kabel, cermin cembung, bayangan awan.
Versi 1A (tiga varian) ada di pulau3-proto.html.
----
File terpisah, tidak menyentuh index.html. Tujuan: membandingkan tiga varian tampilan dan mengukur FPS di HP.
  A: petak 16 px, tinggi layar logika 192 px (12 petak)  = seperti pulau lama
  B: petak 16 px, tinggi layar logika 288 px (18 petak)  = lebih luas
  C: petak 32 px, tinggi layar logika 384 px (12 petak)  = detail 2 kali lebih halus
Semua gambar dibuat dari kode (tanpa file gambar). Peta, kamera, tabrakan, dan tangga memakai grid petak yang sama di semua varian.
-->
<style>

<script>
'use strict';
/* =====================================================================
   SAMBUNGAN KE GAME UTAMA (2A)
   Memakai project Firebase dan login yang sama dengan index.html (REST, tanpa SDK).
   Halaman ini hanya MEMBACA save (pulau-mancing). Tidak ada penulisan save di sini.
   ===================================================================== */
const FB_KEY='AIzaSyDQAa7hgphhZe6gyYZQaGXChcO1c6RGIaQ',FB_URL='https://mancing-ikan-74951-default-rtdb.asia-southeast1.firebasedatabase.app',ISL3=3,BACK='index.html';
let SV={},AU=null;
try{SV=JSON.parse(localStorage.getItem('pulau-mancing')||'null')||{}}catch(e){}
try{AU=JSON.parse(localStorage.getItem('pm-au')||'null')}catch(e){}
const GATE=!(SV&&Array.isArray(SV.inv))?'Data game belum ditemukan. Buka game utama dulu, lalu kembali ke sini.':!AU||!AU.rt?'Kamu belum login. Login dulu di game utama.':!SV.gm?'Pulau 3 masih dalam pengembangan dan hanya bisa dibuka dengan mode GM.':'';
async function auToken(){if(AU.tok&&Date.now()<AU.exp-60000)return AU.tok;
 try{const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AU.rt)}),d=await r.json();
  if(!d.id_token)return '';AU.tok=d.id_token;AU.exp=Date.now()+(+d.expires_in||3600)*1000;
  if(d.refresh_token&&d.refresh_token!==AU.rt){AU.rt=d.refresh_token;try{localStorage.setItem('pm-au',JSON.stringify({u:AU.u,uid:AU.uid,rt:AU.rt}))}catch(e){}}
  return AU.tok}catch(e){return ''}}
const NET={ok:0,code:'',t:0,n:0};const OT={}; // OT: pemain lain di Pulau 3
const netEl=document.querySelector('#net span'),netDot=document.querySelector('#net i');
function netShow(){const n=Date.now();let c='#888',m='Menghubungkan…';
 if(NET.t){if(n-NET.t>12000){c='#e8a800';m='Menunggu koneksi…'}else if(!NET.ok){c='#e04a3a';m='Presence DITOLAK (kode '+NET.code+'). Cek Rules Firebase untuk i=3.'}else{c='#2fc46a';m='Online. '+NET.n+' pemain lain di Pulau 3'}}
 netDot.style.background=c;netEl.textContent=m}
let lastJ='',lastS=0,pBusy=0,gBusy=0;
async function presTick(){if(pBusy||document.hidden)return;pBusy=1;try{const tok=await auToken();if(!tok){NET.ok=0;NET.code='token';NET.t=Date.now();pBusy=0;return}
  const f=v=>+(+v||0).toFixed(2),dx=[0,-1,0,1][Pl.dir]||0,dy=[1,0,-1,0][Pl.dir]||0,url=FB_URL+'/island/'+AU.uid+'.json?auth='+encodeURIComponent(tok);
  const o={n:String(AU.u).slice(0,14),x:f(Pl.x),y:f(Pl.y),fx:dx,fy:dy,s:'walk',tx:0,ty:0,i:ISL3,k:SV.skin|0,e:0,lv:SV.lvl|0,pt:-1,sl:0};
  const j=JSON.stringify(o),n=Date.now();
  if(j!==lastJ||n-lastS>2500){lastJ=j;lastS=n;o.t=n;window.__LU=url;const r=await fetch(url,{method:'PUT',body:JSON.stringify(o)});NET.ok=r.ok;NET.code=r.status;NET.t=Date.now()}
  else if(!NET.t){NET.t=Date.now();NET.ok=1}
 }catch(e){NET.ok=0;NET.code='jaringan';NET.t=Date.now()}pBusy=0}
async function getOthers(){if(gBusy||document.hidden)return;gBusy=1;try{const tok=await auToken();if(!tok){gBusy=0;return}
  const r=await fetch(FB_URL+'/island.json?orderBy=%22t%22&limitToLast=30&auth='+encodeURIComponent(tok));if(!r.ok){gBusy=0;return}
  const d=(await r.json())||{},now=Date.now();let c=0;
  for(const id in d){const x=d[id];if(!x||typeof x!=='object'||id===AU.uid||(x.i|0)!==ISL3||typeof x.x!=='number'||typeof x.y!=='number')continue;
   let g=OT[id];if(!g){g=OT[id]={vx:x.x,vy:x.y,dir:0,ph:0,mv:0,sd:0,seen:now,t:0}}
   if(g.t!==x.t){g.t=x.t;g.seen=now}g.x=x.x;g.y=x.y;g.n=String(x.n||'?').replace(/[<>&"'`]/g,'').slice(0,14);g.fx=+x.fx||0;g.fy=+x.fy||0}
  for(const id in OT){if(!(id in d)||now-OT[id].seen>10000)delete OT[id]}
  NET.n=Object.keys(OT).length}catch(e){}gBusy=0}
function updOthers(dt){for(const id in OT){const g=OT[id],ox=g.vx,oy=g.vy,k=1-Math.exp(-9*dt);g.vx+=(g.x-g.vx)*k;g.vy+=(g.y-g.vy)*k;const d=Math.hypot(g.vx-ox,g.vy-oy);g.mv=d/dt>.4;
  if(g.mv){g.ph+=dt*6;if(Math.abs(g.vx-ox)>Math.abs(g.vy-oy)*1.05)g.dir=g.vx>ox?3:1;else g.dir=g.vy>oy?0:2}}}
addEventListener('pagehide',()=>{const u=window.__LU;if(u){window.__LU=null;try{fetch(u,{method:'DELETE',keepalive:true})}catch(e){}}});
document.getElementById('back').addEventListener('click',()=>{if(window.__bk)return;window.__bk=1;const o=document.createElement('div');o.id='bkld';o.style.cssText='position:fixed;inset:0;z-index:99;background:linear-gradient(#0b2a45,#07182a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#eaf2f7;font:600 16px system-ui,sans-serif;opacity:0;transition:opacity .35s';o.innerHTML='<div style="font-size:46px">⛵</div>Pulang ke Pulau Rumah…';document.body.appendChild(o);requestAnimationFrame(()=>{o.style.opacity=1});setTimeout(()=>{location.href=BACK},450)});
addEventListener('pageshow',e=>{if(e.persisted){window.__bk=0;const o=document.getElementById('bkld');if(o)o.remove()}});

/* =====================================================================
   DATA PETA (grid logika 48 x 36 petak, sama di semua varian)
   tipe: 0 laut, 1 pasir, 2 rumput, 3 jalan tanah, 4 batu, 5 tebing, 6 tangga, 7 dermaga
   level: 0 pantai, 1 desa, 2 kuil, -1 tebing (tidak bisa dilewati), -2 tangga (jembatan antar level)
   ===================================================================== */
const MW=48,MH=36;
const SEA=0,SAND=1,GRASS=2,PATH=3,STONE=4,CLIFF=5,STAIR=6,DOCK=7,WATER=8,BRIDGE=9,WFALL=10;
const typ=[],lvl=[],sol=[],side=[],POLES=[];
function hs(x,y,s){let n=(x*73856093^y*19349663^s*83492791)>>>0;n=Math.imul(n^(n>>>13),1274126177)>>>0;return((n^(n>>>16))>>>0)/4294967296}
const inB=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const OBJ=[]; // {k:'tree'|'pink'|'house'|'torii'|'lantern'|'shrine',x,y,w,h}
(function build(){
 for(let y=0;y<MH;y++){typ.push(new Array(MW).fill(SEA));lvl.push(new Array(MW).fill(0));sol.push(new Array(MW).fill(false));side.push(new Array(MW).fill(false))}
 const se=(x,y,cx,cy,rx,ry)=>Math.pow(Math.abs(x-cx)/rx,4)+Math.pow(Math.abs(y-cy)/ry,4)<=1;
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(y>=22&&y<=32&&se(x,y,23.5,27,21.5,5.2)){typ[y][x]=SAND;lvl[y][x]=0}
  if(x>=7&&x<=40&&y>=11&&y<=21){typ[y][x]=GRASS;lvl[y][x]=1}
  if(x>=15&&x<=33&&y>=2&&y<=9){typ[y][x]=STONE;lvl[y][x]=2}
 }
 // tebing: tile yang lebih rendah dari tetangga utara/barat/timur
 const L=(x,y)=>inB(x,y)?(typ[y][x]===SEA?-0.5:lvl[y][x]):-0.5;
 const base=lvl.map(r=>r.slice()),bt=typ.map(r=>r.slice());
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const h=bt[y][x]===SEA?0:base[y][x];
  const n=inB(x,y-1)&&bt[y-1][x]!==SEA?base[y-1][x]:-1,w=inB(x-1,y)&&bt[y][x-1]!==SEA?base[y][x-1]:-1,e=inB(x+1,y)&&bt[y][x+1]!==SEA?base[y][x+1]:-1;
  if(n>h&&n>=1){typ[y][x]=CLIFF;lvl[y][x]=-1;sol[y][x]=true}
  else if(bt[y][x]!==SEA&&((w>h&&w>=1)||(e>h&&e>=1))){typ[y][x]=CLIFF;lvl[y][x]=-1;sol[y][x]=true;side[y][x]=true}
 }
 // tangga
 [[23,10],[24,10],[11,22],[12,22],[35,22],[36,22]].forEach(([x,y])=>{typ[y][x]=STAIR;lvl[y][x]=-2;sol[y][x]=false;side[y][x]=false});
 // dermaga
 for(let y=32;y<=35;y++)for(let x=22;x<=23;x++){typ[y][x]=DOCK;lvl[y][x]=0}
 typ[31][22]=typ[31][23]=SAND;
 // sungai kecil di desa (mengalir ke selatan), air terjun di dua tebing, kolam di pantai
 for(let y=11;y<=21;y++)for(let x=27;x<=28;x++){typ[y][x]=WATER;lvl[y][x]=1}
 [[27,10],[28,10],[27,22],[28,22]].forEach(([x,y])=>{typ[y][x]=WFALL;lvl[y][x]=-1;sol[y][x]=true;side[y][x]=false});
 for(let y=23;y<=24;y++)for(let x=27;x<=28;x++){typ[y][x]=WATER;lvl[y][x]=0}
 for(let y=8;y<=9;y++)for(let x=27;x<=28;x++){typ[y][x]=WATER;lvl[y][x]=2} // kolam koi di plaza kuil (sumber air terjun)
 // jalan di desa
 const P=(x,y)=>{if(inB(x,y)&&typ[y][x]===GRASS)typ[y][x]=PATH};
 for(let y=11;y<=21;y++){P(23,y);P(24,y)}
 for(let x=11;x<=36;x++){P(x,16);P(x,17)}
 for(let y=16;y<=21;y++){P(11,y);P(12,y);P(35,y);P(36,y)}
 // jembatan merah di atas sungai
 [[27,16],[28,16],[27,17],[28,17]].forEach(([x,y])=>{typ[y][x]=BRIDGE;lvl[y][x]=1});
 // jalan batu di kuil
 for(let y=2;y<=9;y++)for(let x=23;x<=24;x++)if(typ[y][x]===STONE)typ[y][x]=STONE;
 // bangunan
 const blk=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)sol[j][i]=true};
 const add=(k,x,y,w,h,solid)=>{OBJ.push({k,x,y,w,h});if(solid!==false)blk(x,y,w,h)};
 add('house',13,12,4,2);add('house',30,12,4,2);add('house',17,18,4,2);add('house',29,18,4,2);
 add('shrine',21,3,6,3);
 // torii di puncak tangga (hanya tiang yang padat)
 OBJ.push({k:'torii',x:22,y:9,w:4,h:1});sol[9][22]=true;sol[9][25]=true;
 add('lantern',21,8,1,1);add('lantern',26,8,1,1);
 add('lantern',22,13,1,1);add('lantern',25,13,1,1);
 // tiang listrik, cermin cembung, kotak pos
 [[9,13],[21,15],[34,15],[39,13]].forEach(([x,y])=>{if(typ[y][x]===GRASS&&!sol[y][x]){add('pole',x,y,1,1);POLES.push({x,y})}});
 [[22,19,'mirror'],[25,19,'mailbox'],[25,13,'mirror']].forEach(([x,y,k])=>{if(typ[y][x]===GRASS&&!sol[y][x])add(k,x,y,1,1)});
 // pohon
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(sol[y][x]||typ[y][x]!==GRASS)continue;
  const r=hs(x,y,7);if(r>0.86){
   let near=false;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(inB(x+i,y+j)&&(typ[y+j][x+i]===PATH||typ[y+j][x+i]===STAIR))near=true}
   if(near)continue;
   let seaN=false;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(!inB(x+i,y+j)||typ[y+j][x+i]===SEA)seaN=true}
   if(seaN)continue;
   // jangan menutup rumah
   let hb=false;OBJ.forEach(o=>{if(o.k==='house'&&x>=o.x-1&&x<=o.x+o.w&&y>=o.y-1&&y<=o.y+o.h)hb=true});if(hb)continue;
   add(hs(x,y,9)>0.5&&x>24?'pink':'tree',x,y,1,1);
  }
 }
 // pohon di pantai (kelapa/pinus kecil) tidak dipakai di prototipe
})();
const walkType=t=>t===SAND||t===GRASS||t===PATH||t===STONE||t===STAIR||t===DOCK||t===BRIDGE;

/* =====================================================================
   VARIAN
   ===================================================================== */
const VAR={A:{T:16,H:192,name:'A: petak 16, 12 petak tinggi'},B:{T:16,H:288,name:'B: petak 16, 18 petak tinggi'},C:{T:32,H:384,name:'Pulau 3 · C (petak 32) · 1B+1C'}};
let vkey='C',V=VAR.C,T=32,u=2,FX=true;
let tod=0,petalMode=0;const PETALS=[0,60,200];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
let W=256,H=192,K=1,DPR=1;
const baked={};

/* ---------- alat gambar piksel ---------- */
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function disc(c,cx,cy,r,col){c.fillStyle=col;r=Math.round(r);cx=Math.round(cx);cy=Math.round(cy);for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r*.3));c.fillRect(cx-w,cy+dy,w*2+1,1)}}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);const x=c.getContext('2d');return[c,x]}
function sp(c,tx,ty,T,seed,cols,n){for(let i=0;i<n;i++){const a=hs(tx*31+i,ty*17+i,seed+i),b=hs(tx*13+i,ty*29+i,seed+50+i);c.fillStyle=cols[(a*cols.length)|0];c.fillRect(tx*T+((a*T)|0),ty*T+((b*T)|0),1,1)}}

/* ---------- tanah (dibake sekali per varian) ---------- */
function bake(){
 if(baked[vkey])return baked[vkey];
 const [c,g]=mk(MW*T,MH*T);g.imageSmoothingEnabled=false;
 const d=u*u; // jumlah bintik naik 4x di C, ukuran bintik tetap 1 px => lebih halus
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const t=typ[y][x],X=x*T,Y=y*T;
  if(t===SEA){rect(g,X,Y,T,T,'#2b73b3');sp(g,x,y,T,1,['#3585c6','#256aa8','#3f93d2'],5*d)}
  else if(t===SAND){rect(g,X,Y,T,T,'#e8d6a0');sp(g,x,y,T,2,['#d6c088','#f4e6bb','#c9b377'],8*d)}
  else if(t===GRASS){rect(g,X,Y,T,T,'#7db84a');sp(g,x,y,T,3,['#5e9c38','#a2d45e','#6fae3f','#8cc653'],10*d);
    if(hs(x,y,4)>0.8){const a=(hs(x,y,5)*(T-3))|0,b=(hs(x,y,6)*(T-3))|0;rect(g,X+a,Y+b,u,u,'#f4f0d8');if(u>1)rect(g,X+a+1,Y+b+1,u/2+1,u/2+1,'#f2c14a')}}

function bakeSprites(){
 if(SPR[vkey])return SPR[vkey];
 const o={tree:sprTree(false),pink:sprTree(true),house:sprHouse(),torii:sprTorii(),lantern:sprLantern(),shrine:sprShrine(),pole:sprPole(),mirror:sprMirror(),mailbox:sprMailbox()};
 o.sh={};for(const k in o){if(k!=='sh')o.sh[k]=shadowOf(o[k])}
 return SPR[vkey]=o;
}

/* ---------- pemain (digambar langsung, skala mengikuti u) ---------- */
const Pl={x:23,y:28,L:0,dir:0,ph:0,mv:0,vx:0,vy:0,sd:0};
function drawPlayer(c,sx,sy,p){p=p||Pl;
 // sx,sy = posisi kaki di layar
 const s=u,stl=p.sd>0&&p.mv?Math.round(Math.abs(Math.sin(p.sd*Math.PI))*1.6*s):0,bob=(p.mv?Math.round(Math.abs(Math.sin(p.ph*2))*s):0)+stl,leg=p.mv?Math.round(Math.sin(p.ph*2)*2*s):0;
 c.fillStyle='rgba(20,25,45,.30)';for(let dy=-1.6*s;dy<=1.6*s;dy++){const w=Math.round(9*s*Math.sqrt(1-(dy/(1.6*s))**2));c.fillRect(sx-w*.35,Math.round(sy+dy),w*1.35,1)}
 rect(c,sx-3*s,sy-5*s+bob,2*s,5*s+leg*.0,'#33415c');rect(c,sx+1*s,sy-5*s+bob,2*s,5*s,'#33415c');
 if(p.mv){rect(c,sx-3*s,sy-1*s+Math.max(0,leg)*.5,2*s,1*s,'#eee');rect(c,sx+1*s,sy-1*s+Math.max(0,-leg)*.5,2*s,1*s,'#eee')}else{rect(c,sx-3*s,sy-1*s,2*s,s,'#eee');rect(c,sx+1*s,sy-1*s,2*s,s,'#eee')}
 rect(c,sx-4*s,sy-11*s+bob,8*s,6*s,'#d9534f');rect(c,sx-4*s,sy-7*s+bob,8*s,Math.max(1,s),'#b03c39');
 if(u>1){rect(c,sx-4*s,sy-11*s+bob,Math.max(1,s/2),6*s,'#ec7a76')}
 rect(c,sx-5*s,sy-10*s+bob,1*s,4*s,'#d9534f');rect(c,sx+4*s,sy-10*s+bob,1*s,4*s,'#d9534f');
 rect(c,sx-3*s,sy-17*s+bob,6*s,6*s,'#f1c9a3');
 rect(c,sx-3.5*s,sy-18*s+bob,7*s,3*s,'#2a1b12');
 if(p.dir===0){rect(c,sx-2*s,sy-14*s+bob,1*s,1*s,'#2a1b12');rect(c,sx+1*s,sy-14*s+bob,1*s,1*s,'#2a1b12')}
 else if(p.dir===2){rect(c,sx-3.5*s,sy-15*s+bob,7*s,3*s,'#2a1b12')}
 else if(p.dir===1){rect(c,sx+1*s,sy-14*s+bob,1*s,1*s,'#2a1b12');rect(c,sx-3.5*s,sy-16*s+bob,2*s,3*s,'#2a1b12')}
 else{rect(c,sx-2*s,sy-14*s+bob,1*s,1*s,'#2a1b12');rect(c,sx+1.5*s,sy-16*s+bob,2*s,3*s,'#2a1b12')}
}

/* =====================================================================
   INPUT
   ===================================================================== */
const keys={};let jx=0,jy=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null;
function jset(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),R=r.width/2;if(m>R){dx*=R/m;dy*=R/m}
 jx=dx/R;jy=dy/R;if(Math.hypot(jx,jy)<.15){jx=jy=0}knob.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jset(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);

/* =====================================================================
   GERAK, TABRAKAN, LEVEL
   ===================================================================== */
const R=.28;
function tileAt(x,y){const tx=Math.floor(x),ty=Math.floor(y);return inB(tx,ty)?[tx,ty]:null}
function curStair(){const t=tileAt(Pl.x,Pl.y-.05);return t&&typ[t[1]][t[0]]===STAIR}
function canStand(px,py){
 const pts=[[px-R,py],[px+R,py],[px-R,py-.3],[px+R,py-.3]];const onSt=curStair();
 for(const[a,b]of pts){const t=tileAt(a,b);if(!t)return false;const[tx,ty]=t;
  if(sol[ty][tx]||!walkType(typ[ty][tx]))return false;
  const tl=lvl[ty][tx];if(!(tl===-2||onSt||tl===Pl.L))return false}
 return true}
function step(dt){
 let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(!ax&&!ay){ax=jx;ay=jy}
 let m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;m=1}
 const onSt=curStair(),SPD=3.4*(onSt?.6:1);
 // akselerasi halus
 const k=1-Math.exp(-14*dt);Pl.vx+=(ax*SPD-Pl.vx)*k;Pl.vy+=(ay*SPD-Pl.vy)*k;
 const sp=Math.hypot(Pl.vx,Pl.vy);Pl.mv=sp>.3;
 if(Pl.mv){if(Math.abs(Pl.vx)>Math.abs(Pl.vy)*1.05)Pl.dir=Pl.vx>0?3:1;else Pl.dir=Pl.vy>0?0:2;Pl.ph+=dt*(4+sp*1.2)}
 const ox=Pl.x,oy=Pl.y;
 // sumbu X, dengan geser di sudut (nudge) bila hampir lolos
 const mx=Pl.vx*dt,my=Pl.vy*dt;
 if(mx){const nx=Pl.x+mx;if(canStand(nx,Pl.y))Pl.x=nx;else{Pl.vx=0;if(Math.abs(ay)<.5){for(const n of[.08,.16,.26]){let f=0;for(const sg of[1,-1]){if(canStand(nx,Pl.y+sg*n)){Pl.y+=sg*Math.min(n,Math.abs(mx)*1.5+.01);f=1;break}}if(f)break}}}}
 if(my){const ny=Pl.y+my;if(canStand(Pl.x,ny))Pl.y=ny;else{Pl.vy=0;if(Math.abs(ax)<.5){for(const n of[.08,.16,.26]){let f=0;for(const sg of[1,-1]){if(canStand(Pl.x+sg*n,ny)){Pl.x+=sg*Math.min(n,Math.abs(my)*1.5+.01);f=1;break}}if(f)break}}}}
 // langkah naik tangga: 4 anak tangga per petak
 if(curStair())Pl.sd+=Math.hypot(Pl.x-ox,Pl.y-oy)*4;else Pl.sd=0;
 const t=tileAt(Pl.x,Pl.y-.05);if(t&&lvl[t[1]][t[0]]>=0)Pl.L=lvl[t[1]][t[0]];
}

/* =====================================================================
   KELOPAK & PALET
   ===================================================================== */
let pet=[];function setPetals(n){pet=[];for(let i=0;i<n;i++)pet.push({x:Math.random(),y:Math.random(),v:.04+Math.random()*.05,s:Math.random()*6.28,z:Math.random()<.5?1:2})}
function drawPetals(c,t,dt){
 for(const p of pet){p.y+=p.v*dt;p.x+=Math.sin(t*1.3+p.s)*.02*dt+.01*dt;if(p.y>1.05){p.y=-.05;p.x=Math.random()}if(p.x>1.05)p.x=-.05;
  c.fillStyle=p.z===1?'#fbd0e0':'#f2a8c4';const px=Math.round(p.x*W),py=Math.round(p.y*H),z=Math.max(1,Math.round(p.z*u*.9));c.fillRect(px,py,z+1,z);c.fillRect(px+1,py+1,z,z)}
}
const TOD=[null,{mul:'#ffb98a',add:'rgba(255,120,40,.10)'},{mul:'#4b5a9a',add:null}];

/* =====================================================================
   RENDER
   ===================================================================== */
let camX=0,camY=0,cfx=0,cfy=0,camInit=false;
function render(t,dt){
 const g=ctx,bk=bake(),spr=bakeSprites();
 g.imageSmoothingEnabled=false;
 const maxX=MW*T-W,maxY=MH*T-H;
 const tx=maxX<=0?maxX/2:Math.max(0,Math.min(maxX,Pl.x*T-W/2)),ty=maxY<=0?maxY/2:Math.max(0,Math.min(maxY,(Pl.y-.6)*T-H/2));
 if(!camInit||Math.abs(tx-cfx)>T*5||Math.abs(ty-cfy)>T*5){cfx=tx;cfy=ty;camInit=true}
 else{const kk=1-Math.exp(-7*dt);cfx+=(tx-cfx)*kk;cfy+=(ty-cfy)*kk}
 camX=Math.round(cfx);camY=Math.round(cfy);
 g.fillStyle='#2b73b3';g.fillRect(0,0,W,H);
 g.drawImage(bk,camX,camY,W,H,0,0,W,H);
 // air dinamis: laut, sungai, kolam, air terjun
 const x0=Math.max(0,Math.floor(camX/T)),y0=Math.max(0,Math.floor(camY/T)),x1=Math.min(MW-1,Math.floor((camX+W)/T)),y1=Math.min(MH-1,Math.floor((camY+H)/T));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const tt=typ[y][x];
  if(tt===SEA){const a=hs(x,y,70);const ox=((t*(3+a*4)*u+a*T*3)%(T*1.4))-T*.2;if(ox<0||ox>T-3*u)continue;g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x*T+Math.round(ox)-camX,y*T+Math.round(a*T*.8)-camY,Math.max(2,3*u),1)}
  else if(tt===WATER){g.fillStyle='rgba(255,255,255,.34)';for(let i=0;i<2;i++){const a=hs(x,y,80+i),oy=((t*(lvl[y][x]===1?10:3)*u*(.6+a)+a*T*3)%(T*1.3))-T*.15;if(oy<2*u||oy>T-2*u)continue;g.fillRect(x*T+Math.round(a*T*.6)+3*u-camX,y*T+Math.round(oy)-camY,Math.max(2,(2+a*3)*u),1)}}
  else if(tt===WFALL){g.fillStyle='rgba(245,252,255,.85)';for(let q=3*u;q<T-3*u;q+=Math.max(2,u*2)){const a=hs(x,y,q+500),yy=(t*(36+a*30)*u+a*T)%T;g.fillRect(x*T+q-camX,y*T+Math.round(yy)-camY,Math.max(1,u),Math.max(3,4*u))}}
  if(tt===WATER&&lvl[y][x]===0&&typ[y-1][x]===WFALL){g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<5;i++){const a=hs(x,y,600+i),fl=Math.sin(t*5+a*9)>0;if(!fl)continue;disc(g,x*T+a*T-camX,y*T+T*.2+Math.sin(t*3+i)*u-camY,Math.max(1,1.5*u),'rgba(255,255,255,.75)')}}
  else if(tt===WATER&&lvl[y][x]===1&&typ[y-1][x]===WFALL){g.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<4;i++){const a=hs(x,y,700+i);if(Math.sin(t*4+a*9)>0)g.fillRect(x*T+Math.round(a*T)-camX,y*T+Math.round(T*.15)-camY,Math.max(2,2*u),Math.max(1,u))}}
 }
 // ikan koi di kolam plaza
 for(let i=0;i<3;i++){const a=t*(.7+i*.15)+i*2.1,fx=27.5*T+Math.cos(a)*T*.62+T*.5,fy=8.6*T+Math.sin(a*1.3)*T*.38+T*.5,dx=-Math.sin(a)>0?1:-1,sx=Math.round(fx-camX),sy=Math.round(fy-camY);
  if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;
  g.fillStyle=i===1?'#f2f2f2':'#ff7a2a';g.fillRect(sx,sy,5*u,2*u);g.fillRect(sx+(dx>0?-2:5)*u,sy+(i&1?0:u*.5),2*u,Math.max(1,u*1.5));g.fillStyle='#ff4a1a';g.fillRect(sx+(dx>0?3:0)*u,sy,u*1.5,u)}
 // objek + pemain, urut menurut garis dasar
 const list=[];
 for(const o of OBJ){const bx=(o.x-1)*T,by=(o.y-4)*T,bw=(o.w+2)*T,bh=(o.h+4)*T;if(bx+bw<camX||bx>camX+W||by+bh<camY||by>camY+H)continue;list.push({b:o.y+o.h,o})}
 if(FX&&tod!==2){for(const it of list){const o=it.o,sh=spr.sh[o.k],sw=spr[o.k];g.globalAlpha=tod===1?1.25:1;g.drawImage(sh,Math.round(o.x*T+T*o.w/2-sw.width/2-camX),Math.round((o.y+o.h)*T-camY)-1);g.globalAlpha=1}}
 list.push({b:Pl.y,p:1});for(const id in OT){const g=OT[id];list.push({b:g.vy,q:g})}list.sort((a,b)=>a.b-b.b);
 const glows=[];
 for(const it of list){
  if(it.p){drawPlayer(g,Math.round(Pl.x*T-camX),Math.round(Pl.y*T-camY));continue}
  if(it.q){const q=it.q,qx=Math.round(q.vx*T-camX),qy=Math.round(q.vy*T-camY);drawPlayer(g,qx,qy,q);g.font='bold '+Math.round(5*u)+'px system-ui,sans-serif';g.textAlign='center';g.lineWidth=Math.max(2,u);g.strokeStyle='rgba(10,20,30,.85)';g.fillStyle='#fff';g.strokeText(q.n,qx,qy-21*u);g.fillText(q.n,qx,qy-21*u);continue}
  const o=it.o,s=spr[o.k];const dx=Math.round(o.x*T+T*o.w/2-s.width/2-camX),dy=Math.round((o.y+o.h)*T-s.height-camY);g.drawImage(s,dx,dy);
  if(o.k==='lantern')glows.push([dx+s.width/2,dy+s.height-T*1.1,T*2.6]);
 }
 // kabel listrik antar tiang
 if(POLES.length>1){g.fillStyle='rgba(28,28,40,.92)';
  for(let i=0;i<POLES.length-1;i++){const a=POLES[i],b=POLES[i+1];
   for(const off of[0,.55]){const xa=(a.x+.5)*T,xb=(b.x+.5)*T,ya=(a.y+1)*T-T*(4.7-off),yb=(b.y+1)*T-T*(4.7-off),sag=Math.min(T*1.7,(xb-xa)*.07);
    const xs=Math.max(Math.floor(xa),camX-1),xe=Math.min(Math.ceil(xb),camX+W+1);
    for(let x=xs;x<=xe;x++){const tt=(x-xa)/(xb-xa),y=ya+(yb-ya)*tt+sag*4*tt*(1-tt);g.fillRect(x-camX,Math.round(y-camY),1,Math.max(1,Math.round(u*.6)))}}}}
 // bayangan awan besar yang melintas
 if(FX&&tod!==2){const WW=MW*T+900*u;for(let i=0;i<3;i++){const cx=((t*7*u+i*420*u)%WW)-450*u-camX,cy=MH*T*(.22+.28*i)-camY,R=190*u;if(cx<-R*1.8||cx>W+R*1.8||cy<-R||cy>H+R)continue;
   g.save();g.translate(cx,cy);g.scale(1.7,1);const gr=g.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'rgba(18,34,62,.17)');gr.addColorStop(.7,'rgba(18,34,62,.10)');gr.addColorStop(1,'rgba(18,34,62,0)');g.fillStyle=gr;g.fillRect(-R,-R,R*2,R*2);g.restore()}}
 if(pet.length)drawPetals(g,t,dt);
 // palet jam
 const td=TOD[tod];
 if(td){g.globalCompositeOperation='multiply';g.fillStyle=td.mul;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';if(td.add){g.fillStyle=td.add;g.fillRect(0,0,W,H)}}
 if(tod===2){g.globalCompositeOperation='lighter';for(const[x,y,r]of glows){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,190,90,.55)');gr.addColorStop(1,'rgba(255,190,90,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}g.globalCompositeOperation='source-over'}
 // kabut tipis di lapisan atas layar
 const mg=g.createLinearGradient(0,0,0,H*.35);mg.addColorStop(0,tod===2?'rgba(40,60,110,.25)':'rgba(255,255,255,.12)');mg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=mg;g.fillRect(0,0,W,H*.35);
}

/* ---------- minimap realtime ---------- */
const mm=document.getElementById('mm'),mx=mm.getContext('2d');let mmBase=null;
function mmBake(){const [c,g]=mk(MW,MH);const col=(t,l)=>t===SEA?'#2f6fb0':t===CLIFF?'#6b5a4a':t===STAIR?'#d9d2c0':t===DOCK?'#9a6b3c':t===WATER?'#4aa0e0':t===BRIDGE?'#c8321f':t===WFALL?'#cfeeff':l===0?'#e6d3a1':l===1?(t===PATH?'#c9a56b':'#8fc060'):'#c8c0b0';
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){g.fillStyle=col(typ[y][x],lvl[y][x]);g.fillRect(x,y,1,1)}
 OBJ.forEach(o=>{if(o.k==='house'||o.k==='shrine'){g.fillStyle='#5b3d27';g.fillRect(o.x,o.y,o.w,o.h)}});mmBase=c}
function mmDraw(t){if(!mmBase)mmBake();mx.drawImage(mmBase,0,0);if(Math.floor(t*3)%2===0){mx.fillStyle='#ff2a2a';mx.fillRect(Math.floor(Pl.x)-1,Math.floor(Pl.y)-1,3,3)}else{mx.fillStyle='#fff';mx.fillRect(Math.floor(Pl.x),Math.floor(Pl.y),1,1)}}

/* ---------- ukuran layar & varian ---------- */
function resize(){
 DPR=window.devicePixelRatio||1;const cw=innerWidth*DPR,ch=innerHeight*DPR;
 K=Math.max(1,Math.floor(ch/V.H));H=V.H;W=Math.max(Math.round(H*4/3),Math.floor(cw/K));
 cv.width=W;cv.height=H;cv.style.width=(W*K/DPR)+'px';cv.style.height=(H*K/DPR)+'px';
}
function setVar(k){vkey=k;V=VAR[k];T=V.T;u=T/16;resize()}
function setTod(i){tod=i;document.querySelectorAll('#gt button').forEach(b=>b.classList.toggle('on',+b.dataset.t===i))}
function setPet(i){petalMode=i;setPetals(PETALS[i]);const b=document.querySelector('#gp button');b.textContent='Kelopak '+PETALS[i];b.classList.toggle('on',i>0)}
document.getElementById('fxb').addEventListener('click',e=>{FX=!FX;e.target.textContent='Efek '+(FX?'ON':'OFF');e.target.classList.toggle('on',FX)});
document.getElementById('gt').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTod(+b.dataset.t)});
document.getElementById('gp').addEventListener('click',()=>setPet((petalMode+1)%PETALS.length));
addEventListener('resize',resize);

/* ---------- loop & FPS ---------- */
const info=document.getElementById('info'),lvEl=document.getElementById('lv');
const fr=[];let last=performance.now(),lastInfo=0;
function loop(now){
 let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
 fr.push(dt*1000);if(fr.length>120)fr.shift();
 step(dt);updOthers(dt);render(now/1000,dt);mmDraw(now/1000);
 if(now-lastInfo>400){lastInfo=now;const avg=fr.reduce((a,b)=>a+b,0)/fr.length,worst=Math.max(...fr);
  info.innerHTML='<b>'+V.name+'</b><br>FPS <b>'+(1000/avg).toFixed(0)+'</b> (terburuk '+(1000/worst).toFixed(0)+') · layar logika '+W+'x'+H+' · skala x'+K+' · '+(W/T).toFixed(1)+'x'+(H/T).toFixed(1)+' petak';
  lvEl.textContent='Level '+(Pl.L===0?'0 pantai':Pl.L===1?'1 desa':'2 kuil')}
 requestAnimationFrame(loop);
}
function ldSet(p,t){const b=document.getElementById('lbar'),x=document.getElementById('ltx');if(b)b.style.width=p+'%';if(x&&t)x.textContent=t}
function ldDone(){const l=document.getElementById('load');if(l){l.classList.add('out');setTimeout(()=>l.remove(),600)}}
const T0=performance.now();
function boot(){
ldSet(35,'Menggambar pulau');
setVar('C');setTod(0);setPet(0);
window.__p3={Pl,setVar,setTod,setPet,OT,NET,get K(){return K}};
if(GATE){ldDone();const gt=document.getElementById('gate');document.getElementById('gmsg').innerHTML=GATE+'<br><a href="'+BACK+'">⬅ Kembali ke game</a>';gt.style.display='flex';return}
ldSet(65,'Menyambung ke pemain lain');
setInterval(presTick,1000);setInterval(getOthers,1500);setInterval(netShow,500);
Promise.race([Promise.all([presTick(),getOthers()]),new Promise(r=>setTimeout(r,2500))]).then(()=>{ldSet(100,'Siap');setTimeout(ldDone,Math.max(150,1100-(performance.now()-T0)))});
requestAnimationFrame(loop)}
requestAnimationFrame(()=>setTimeout(boot,40));
</script>
