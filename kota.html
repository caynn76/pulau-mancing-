 else if(k===WALL){if(ty===34){R(g,X,Y,T,T,'#2f4f7f');R(g,X,Y,T,3,'#5a82b5');R(g,X,Y+T-6,T,6,'#1f3558');sp(g,X,Y,10,['#3a5c8e','#27446f'],8,tx,ty)}

function bake(cx,cy){const c=document.createElement('canvas');c.width=CW*T;c.height=CH*T;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
