#gate div{max-width:360px;line-height:1.5;font-size:14px}#gate a{display:inline-block;margin-top:14px;padding:9px 16px;background:var(--ac);color:#201400;border-radius:10px;text-decoration:none;font-weight:700}

</style>

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const FB_KEY='AIzaSyDQAa7hgphhZe6gyYZQaGXChcO1c6RGIaQ',FB_URL='https://mancing-ikan-74951-default-rtdb.asia-southeast1.firebasedatabase.app',ISL4=4,BACK='index.html',ISL3='pulau3.html';
let SV={},AU=null;
try{SV=JSON.parse(localStorage.getItem('pulau-mancing')||'null')||{}}catch(e){}

async function auToken(){if(AU.tok&&Date.now()<AU.exp-60000)return AU.tok;
 try{const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AU.rt)}),d=await r.json();

const NET={ok:0,code:'',t:0,n:0},OT={};
const netEl=document.querySelector('#net span'),netDot=document.querySelector('#net i');

 netDot.style.background=c;netEl.textContent=m}

async function presTick(){if(pBusy||document.hidden)return;pBusy=1;try{const tok=await auToken();if(!tok){NET.ok=0;NET.code='token';NET.t=Date.now();pBusy=0;return}
  const f=v=>+(+v||0).toFixed(2),dx=[0,-1,0,1][Pl.dir]||0,dy=[1,0,-1,0][Pl.dir]||0,url=FB_URL+'/island/'+AU.uid+'.json?auth='+encodeURIComponent(tok);
  const o={n:String(AU.u).slice(0,14),x:f(Pl.x),y:f(Pl.y),fx:dx,fy:dy,s:'walk',tx:0,ty:0,i:ISL4,k:SV.skin|0,e:0,lv:SV.lvl|0,pt:-1,sl:0};
  const j=JSON.stringify(o),n=Date.now();

  else if(!NET.t){NET.t=Date.now();NET.ok=1}
 }catch(e){NET.ok=0;NET.code='jaringan';NET.t=Date.now()}pBusy=0}
async function getOthers(){if(gBusy||document.hidden)return;gBusy=1;try{const tok=await auToken();if(!tok){gBusy=0;return}
  const r=await fetch(FB_URL+'/island.json?orderBy=%22t%22&limitToLast=30&auth='+encodeURIComponent(tok));if(!r.ok){gBusy=0;return}
  const d=(await r.json())||{},now=Date.now();
  for(const id in d){const x=d[id];if(!x||typeof x!=='object'||id===AU.uid||(x.i|0)!==ISL4||typeof x.x!=='number'||typeof x.y!=='number')continue;
   let g=OT[id];if(!g){g=OT[id]={vx:x.x,vy:x.y,dir:(+x.fx<0?1:+x.fx>0?3:+x.fy<0?2:0),ph:0,mv:0,seen:now,t:0}}
   if(g.t!==x.t){g.t=x.t;g.seen=now}g.x=x.x;g.y=x.y;g.n=String(x.n||'?').replace(/[<>&"'`]/g,'').slice(0,14);g.fx=+x.fx||0;g.fy=+x.fy||0}
  for(const id in OT){if(!(id in d)||now-OT[id].seen>10000)delete OT[id]}
  NET.n=Object.keys(OT).length}catch(e){}gBusy=0}
function updOthers(dt){for(const id in OT){const g=OT[id],ox=g.vx,oy=g.vy,k=1-Math.exp(-9*dt);g.vx+=(g.x-g.vx)*k;g.vy+=(g.y-g.vy)*k;const d=Math.hypot(g.vx-ox,g.vy-oy);g.mv=d/dt>.4;
  if(g.mv){g.idle=0;g.ph+=dt*6;if(Math.abs(g.vx-ox)>Math.abs(g.vy-oy)*1.05)g.dir=g.vx>ox?3:1;else g.dir=g.vy>oy?0:2}
  else{g.idle=(g.idle||0)+dt;if(g.idle>.8&&(g.fx||g.fy))g.dir=g.fx<0?1:g.fx>0?3:g.fy<0?2:0}
  g.sit=!g.mv&&seatAt(g.vx,g.vy)}}
addEventListener('pagehide',()=>{const u=window.__LU;if(u){window.__LU=null;try{fetch(u,{method:'DELETE',keepalive:true})}catch(e){}}});

/* =====================================================================
   PETA KOTA TOKYO (96 x 64 petak, grid 32px sama dengan Pulau 3)
   Distrik berdasarkan 10 foto referensi:
   - Selatan-Barat: Stasiun Shinkansen & Plaza Hachiko + Pintu Subway
   - Tengah-Barat: Shibuya Scramble Crossing (zebra cross diagonal + menara 109 + layar LED raksasa)
   - Tengah-Selatan & Timur: Boulevard Konbini (7-Eleven), trotoar motif berlian, meteran parkir, siluet Tokyo Tower di utara
   - Timur-Laut: Gang Neon Kabukicho (papan neon vertikal bertumpuk, skybridge, lampion izakaya)
   - Utara: Tepian Sungai Sumida & Jembatan Cahaya (pemandangan senja kota)
   ===================================================================== */
const MW=96,MH=64,T=32,u=2;
const VOID=0,ROAD=1,WALK=2,PLAZA=3,PLAT=4,RAIL=5,ALLEY=6,RIVER=7,BRIDGE=8;
const typ=[],sol=[],COL=[],OBJ=[],NEONS=[],LAMPS=[],CROSSW=[],TREES=[],POLES=[],WIRES=[],ANTENNAS=[];
function hs(x,y,s){let n=(x*73856093^y*19349663^s*83492791)>>>0;n=Math.imul(n^(n>>>13),1274126177)>>>0;return((n^(n>>>16))>>>0)/4294967296}
const inB=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;

(function buildCity(){
 for(let y=0;y<MH;y++){typ.push(new Array(MW).fill(VOID));sol.push(new Array(MW).fill(true))}
 const fill=(t,x0,y0,x1,y1,s=false)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inB(x,y)){typ[y][x]=t;sol[y][x]=s}};
 const add=(k,x,y,w,h,solid=true)=>{OBJ.push({k,x,y,w,h});if(solid)for(let j=Math.floor(y);j<Math.ceil(y+h);j++)for(let i=Math.floor(x);i<Math.ceil(x+w);i++)if(inB(i,j))sol[j][i]=true};
 const addC=(k,x,y,w,h,...boxes)=>{OBJ.push({k,x,y,w,h});boxes.forEach(b=>COL.push([x+b[0],y+b[1],x+b[2],y+b[3]]))};

 // 1. SUNGAI SUMIDA & PROMENADE UTARA (ref: sunset skyline & sungai)
 fill(RIVER,0,0,95,6,true);
 fill(BRIDGE,32,0,37,6,false); // jembatan besar menyeberangi sungai
 fill(WALK,4,7,91,9,false);    // promenade tepi sungai

 // 2. JALAN RAYA UTAMA & SHIBUYA SCRAMBLE CROSSING (ref: 1000384987, 1000384979, 1000384985)
 // Jalan Horizontal Utama (Boulevard Tokyo): y = 32..37
 fill(WALK,4,30,91,31,false);
 fill(ROAD,4,32,91,37,false);
 fill(WALK,4,38,91,39,false);

 fill(WALK,30,10,31,45,false);
 fill(ROAD,32,10,37,45,false);
 fill(WALK,38,10,39,45,false);

 fill(ROAD,32,32,37,37,false);
 fill(PLAZA,27,27,31,31,false); // sudut 109 / QFRONT
 fill(PLAZA,38,27,42,31,false); // sudut Tsutaya / Starbucks
 fill(PLAZA,27,38,31,42,false); // sudut plaza stasiun
 fill(PLAZA,38,38,42,42,false); // sudut pintu subway

 // 3. PLAZA STASIUN & PERON SHINKANSEN (Selatan-Barat, x=6..31, y=42..58)
 fill(PLAZA,8,42,31,48,false);
 fill(WALK,16,49,21,52,false); // lorong pintu tiket stasiun
 fill(PLAT,6,53,34,56,false);  // peron Shinkansen
 fill(RAIL,0,57,38,59,true);   // rel Shinkansen

 // 4. GANG NEON KABUKICHO (Timur-Laut, ref: 1000384975 & 1000384969)
 fill(ALLEY,64,10,68,29,false); // gang sempit vertikal bertumpuk papan neon
 fill(ALLEY,52,18,78,20,false); // gang silang izakaya
 fill(WALK,76,10,79,29,false);  // jalan akses timur

 // 5. TAMAN KECIL DEKAT MENARA TOKYO (Tengah-Utara, x=44..58, y=11..16)
 fill(PLAZA,44,11,58,16,false);

 add('st_wall',6,49,10,4,true);

 addC('subway',39,39,3,3,[.1,.2,2.9,2.8]);

 addC('hachiko',25,44,2,2,[.4,.5,1.6,1.7]);

 add('qfront',15,22,8,8,true);

 for(let gx=46.5;gx<=52.5;gx+=1.5)addC('guardrail',gx,38.1,1,1,[.1,.5,.9,.85]);
 addC('nobori',45.3,38.2,1,1,[.35,.6,.65,.9]);

 // Deretan Gedung Komersial & Department Store di sepanjang Boulevard & Avenue
 const blds=[
  ['bldg_a',6,23,8,7],['bldg_b',6,39,8,5],['bldg_c',33,42,6,5],['bldg_a',40,42,5,5],

 ];

// Siklus Lampu Lalu Lintas (0..18s: Mobil Horizontal Hijau, 18..36s: Mobil Vertikal Hijau, 36..52s: Semua Merah -> Pejalan Kaki Scramble Hijau!)
function sigState(t){const m=t%52;return m<18?0:m<36?1:2}

function updCars(dt,t){
 const sig=sigState(t);
 for(const c of CARS){
  let stop=false;
  if(c.h){
   const go=(sig===0);
   if(!go){
    if(c.v>0&&c.x>27.5&&c.x<30.3)stop=true;
    if(c.v<0&&c.x<42.5&&c.x>39.7)stop=true;
   }
   // Jaga jarak dengan mobil di depan
   for(const o of CARS)if(o!==c&&o.h&&Math.abs(o.y-c.y)<.5){
    const d=(o.x-c.x)*Math.sign(c.v);if(d>0&&d<c.len+.9)stop=true;
   }
   if(!stop){c.x+=c.v*dt;if(c.x>94)c.x=2;if(c.x<2)c.x=94}
  }else{
   const go=(sig===1);
   if(!go){
    if(c.v>0&&c.y>27.5&&c.y<30.3)stop=true;
    if(c.v<0&&c.y<42.5&&c.y>39.7)stop=true;
   }
   for(const o of CARS)if(o!==c&&!o.h&&Math.abs(o.x-c.x)<.5){
    const d=(o.y-c.y)*Math.sign(c.v);if(d>0&&d<c.len+.9)stop=true;
   }
   if(!stop){c.y+=c.v*dt;if(c.y>46)c.y=9;if(c.y<9)c.y=46}
  }
 }
}

/* =====================================================================
   PEJALAN KAKI (WARGA TOKYO & KERAMAIAN SCRAMBLE CROSSING)
   ===================================================================== */
const PEDS=[];
const CLOTHES=['#2b303a','#e8ecf2','#3f6fb5','#d9534f','#8c7a6b','#4a7c59','#c96480','#d9a036'];
for(let i=0;i<34;i++){
 const mode=i%3; // 0: trotoar horizontal, 1: gang Kabukicho, 2: penyeberang Scramble Crossing
 if(mode===0){
  PEDS.push({m:0,x:8+hs(i,1,5)*80,y:(i%2?30.7:38.6)+(hs(i,2,5)-.5)*.4,v:(i%2?1:-1)*(.9+hs(i,3,5)*.6),c:CLOTHES[i%CLOTHES.length],ph:hs(i,4,5)*6});
 }else if(mode===1){
  PEDS.push({m:1,x:64.8+hs(i,5,5)*2.4,y:11+hs(i,6,5)*17,v:(i%2?1:-1)*(.8+hs(i,7,5)*.5),c:CLOTHES[i%CLOTHES.length],ph:hs(i,8,5)*6});
 }else{
  const c1=[[30.5,30.5],[39.5,30.5],[30.5,39.5],[39.5,39.5]][i%4];
  const c2=[[39.5,39.5],[30.5,39.5],[39.5,30.5],[30.5,30.5]][i%4];
  PEDS.push({m:2,x:c1[0],y:c1[1],ax:c1[0],ay:c1[1],bx:c2[0],by:c2[1],toB:true,spd:1.1+hs(i,9,5)*.5,c:CLOTHES[i%CLOTHES.length],ph:hs(i,1,6)*6});
 }
}
function updPeds(dt,t){
 const scramble=(sigState(t)===2);
 for(const p of PEDS){
  if(p.m===0){
   p.x+=p.v*dt;p.ph+=dt*7;
   if(p.x>90)p.x=6;if(p.x<6)p.x=90;
  }else if(p.m===1){
   p.y+=p.v*dt;p.ph+=dt*7;
   if(p.y>28.5)p.y=11;if(p.y<11)p.y=28.5;
  }else{
   const tx=p.toB?p.bx:p.ax,ty=p.toB?p.by:p.ay;
   const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
   const inRoad=(p.x>31.5&&p.x<38.5&&p.y>31.5&&p.y<38.5);
   if((scramble||inRoad)&&d>.15){
    p.x+=(dx/d)*p.spd*dt;p.y+=(dy/d)*p.spd*dt;p.ph+=dt*8;
   }else if(d<=.15){p.toB=!p.toB}
  }
 }
}

 jx=dx/R;jy=dy/R;if(Math.hypot(jx,jy)<.15){jx=jy=0}knob.style.transform='translate('+dx+'px,'+dy+'px)'}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jset(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);

const R=.28;
function canStand(px,py){
 const pts=[[px-R,py],[px+R,py],[px-R,py-.3],[px+R,py-.3]];
 for(const[a,b]of pts){
  const tx=Math.floor(a),ty=Math.floor(b);
  if(!inB(tx,ty)||sol[ty][tx])return false;
  for(let i=0;i<COL.length;i++){const q=COL[i];if(a>q[0]&&a<q[2]&&b>q[1]&&b<q[3])return false}
 }
 return true;
}
function step(dt){
 let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(!ax&&!ay){ax=jx;ay=jy}
 if(SIT.on){if(Math.hypot(ax,ay)>.35)standUp();else ax=ay=0}
 if(UI.card||UI.busy){ax=ay=0}
 let m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m}
 const SPD=3.6,k=1-Math.exp(-14*dt);
 Pl.vx+=(ax*SPD-Pl.vx)*k;Pl.vy+=(ay*SPD-Pl.vy)*k;
 const sp=Math.hypot(Pl.vx,Pl.vy);Pl.mv=sp>.3;
 if(Pl.mv){if(Math.abs(Pl.vx)>Math.abs(Pl.vy)*1.05)Pl.dir=Pl.vx>0?3:1;else Pl.dir=Pl.vy>0?0:2;Pl.ph+=dt*(4+sp*1.2)}
 const mx=Pl.vx*dt,my=Pl.vy*dt;
 if(mx){const nx=Pl.x+mx;if(canStand(nx,Pl.y))Pl.x=nx;else{Pl.vx=0;if(Math.abs(ay)<.5){for(const n of[.08,.16,.26]){let f=0;for(const sg of[1,-1]){if(canStand(nx,Pl.y+sg*n)){Pl.y+=sg*Math.min(n,Math.abs(mx)*1.5+.01);f=1;break}}if(f)break}}}}
 if(my){const ny=Pl.y+my;if(canStand(Pl.x,ny))Pl.y=ny;else{Pl.vy=0;if(Math.abs(ax)<.5){for(const n of[.08,.16,.26]){let f=0;for(const sg of[1,-1]){if(canStand(Pl.x+sg*n,ny)){Pl.x+=sg*Math.min(n,Math.abs(my)*1.5+.01);f=1;break}}if(f)break}}}}
}

const TRN={st:'dwell',t:4,x:14,door:1,vis:1,ch:0};
const TSTOP=14,TSTART=-22,TY=58.2;
let TRSPR=null;
function bakeTrain(){
 const L=Math.round(15*T),H=Math.round(2.55*T),[c,g]=mk(L,H),bB=H-Math.round(.34*T),bH=Math.round(1.95*T),NL=Math.round(3.2*T),car=Math.round(5*T),wins=[],doors=[];
 g.imageSmoothingEnabled=false;
 for(let x=0;x<L;x++){
  const rx=L-1-x,f=rx<NL?.16+.84*(1-Math.pow(1-rx/NL,2.2)):1,hh=Math.round(bH*f),yT=bB-hh;
  g.fillStyle='#f3f5f7';g.fillRect(x,yT,1,hh);g.fillStyle='#d5dbe1';g.fillRect(x,yT,1,2);
  const s0=Math.max(bB-Math.round(.36*bH),yT),s1=bB-Math.round(.24*bH);if(s1>s0){g.fillStyle='#1f5fa8';g.fillRect(x,s0,1,s1-s0)}
 }
 const dw=Math.round(.62*T),dy=bB-Math.round(.84*bH),dh=Math.round(.8*bH);
 [2*T,6*T,10*T].forEach(x=>{doors.push({x,y:dy,w:dw,h:dh});rect(g,x,dy,dw,dh,'#dfe5ea');rect(g,x+5,dy+6,dw-10,16,'#1b2a44')});
 const wy=bB-Math.round(.78*bH),wh=Math.round(.3*bH),ww=Math.round(.68*T);
 for(let cx=T;cx<L-NL;cx+=T){if(doors.some(d=>Math.abs(cx-d.x)<22))continue;wins.push([cx,wy,ww,wh]);rect(g,cx,wy,ww,wh,'#1e2c46')}
 rect(g,0,bB,L-Math.round(.5*T),H-bB,'#2c3038');
 return TRSPR={c,wins,doors};
}
function updTrain(dt){
 const q=TRN;q.t+=dt;
 if(q.st==='dwell'){q.x=TSTOP;q.vis=1;q.door=q.t<20?Math.min(1,q.t/1.2):Math.max(0,1-(q.t-20)/1.2);if(q.t>=22){q.st='depart';q.t=0;q.door=0}}
 else if(q.st==='depart'){const p=Math.min(1,q.t/8);q.x=TSTOP+(TSTART-TSTOP)*p*p;q.vis=q.x>-16;if(p>=1){q.st='away';q.t=0}}
 else if(q.st==='away'){q.vis=0;if(q.t>=8){q.st='arrive';q.t=0;q.x=TSTART}}
 else{const p=Math.min(1,q.t/8);q.x=TSTART+(TSTOP-TSTART)*(1-(1-p)*(1-p));q.vis=q.x>-16;if(p>=1){q.st='dwell';q.t=0}}
}
function drawTrain(g,camX,camY){

 g.fillStyle='rgba(10,15,28,.35)';g.fillRect(sx,by-4,s.c.width,4);g.drawImage(s.c,sx,sy);
 if(TS.n>.2){g.fillStyle='rgba(255,224,150,'+(.85*TS.n).toFixed(2)+')';for(const w of s.wins)g.fillRect(sx+w[0],sy+w[1],w[2],w[3])}
 if(TRN.door>.02)for(const d of s.doors){const ow=Math.max(1,Math.round(d.w*TRN.door)),ox=sx+d.x+((d.w-ow)>>1);rect(g,ox,sy+d.y,ow,d.h,'#2b211b');rect(g,ox+1,sy+d.y+1,Math.max(1,ow-2),d.h-2,'#ffdf9a')}
}

function render(t,dt){
 updTime();updWx(dt);TS.sh*=Math.max(0,1-.9*WX.rain-.4*WX.mist);
 const NE=Math.max(TS.n,WX.rain*.45+WX.mist*.2);
 const g=ctx,bk=bakeGround(),spr=bakeSprites();
 g.imageSmoothingEnabled=false;

 const maxX=MW*T-W,maxY=MH*T-H;
 const tx=maxX<=0?maxX/2:Math.max(0,Math.min(maxX,Pl.x*T-W/2)),ty=maxY<=0?maxY/2:Math.max(0,Math.min(maxY,(Pl.y-.6)*T-H/2));
 if(!camInit||Math.abs(tx-cfx)>T*6||Math.abs(ty-cfy)>T*6){cfx=tx;cfy=ty;camInit=true}
 else{const kk=1-Math.exp(-7*dt);cfx+=(tx-cfx)*kk;cfy+=(ty-cfy)*kk}
 camX=Math.round(cfx);camY=Math.round(cfy);

 g.fillStyle='#080d16';g.fillRect(0,0,W,H);
 g.drawImage(bk,camX,camY,W,H,0,0,W,H);

 // Riak Sungai Sumida di Utara
 if(camY<8*T){
  g.fillStyle='rgba(140,200,255,.22)';
  for(let y=0;y<6;y++)for(let x=Math.max(0,Math.floor(camX/T));x<=Math.min(MW-1,Math.floor((camX+W)/T));x++){
   if(typ[y][x]!==RIVER)continue;
   const ox=((t*12+hs(x,y,70)*32)%32);
   g.fillRect(x*T+Math.round(ox)-camX,y*T+12-camY,8,2);
  }
 }

 // Kumpulkan objek & entitas untuk depth-sorting (Y-sort)
 const list=[];
 for(const o of OBJ){
  const bx=(o.x-2)*T,by=(o.y-12)*T,bw=(o.w+4)*T,bh=(o.h+13)*T;
  if(bx+bw<camX||bx>camX+W||by+bh<camY||by>camY+H)continue;
  list.push({b:o.y+o.h,o});
 }
 if(FX&&TS.sh>.04){
  for(const it of list){const o=it.o;if(!spr.sh[o.k])continue;const sh=spr.sh[o.k],sw=spr[o.k];g.globalAlpha=TS.sh;g.drawImage(sh,Math.round(o.x*T+T*o.w/2-sw.width/2-camX),Math.round((o.y+o.h)*T-camY)-1);g.globalAlpha=1}
 }
 if(TRN.vis)list.push({b:TY,tr:1});
 list.push({b:Pl.y,p:1});
 for(const id in OT)list.push({b:OT[id].vy,q:OT[id]});
 for(const c of CARS)list.push({b:c.y,car:c});
 for(const pd of PEDS)list.push({b:pd.y,ped:pd});
 list.sort((a,b)=>a.b-b.b);

 const glows=[],sig=sigState(t);
 for(const it of list){
  if(it.tr){drawTrain(g,camX,camY);continue}
  if(it.p){drawPlayer(g,Math.round(Pl.x*T-camX),Math.round(Pl.y*T-camY));continue}
  if(it.q){const q=it.q,qx=Math.round(q.vx*T-camX),qy=Math.round(q.vy*T-camY);drawPlayer(g,qx,qy,q);g.font='bold 10px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(q.n,qx,qy-42);continue}
  if(it.car){drawCar(g,it.car,camX,camY);if(NE>.2)glows.push([Math.round(it.car.x*T-camX),Math.round(it.car.y*T-camY-8),48,'rgba(255,235,160,.45)']);continue}

  const o=it.o;
  if(o.k==='tlight'){
   const sx=Math.round(o.x*T-camX),sy=Math.round(o.y*T-camY);
   rect(g,sx-2,sy-54,4,54,'#3a404c');rect(g,sx-14,sy-52,28,10,'#1e222a');
   const green=(sig===2)||(o.ph===0&&sig===0)||(o.ph===1&&sig===1);
   rect(g,sx-10,sy-50,6,6,green?'#333':'#ff2a2a');
   rect(g,sx+4,sy-50,6,6,green?'#2aff6d':'#333');
   if(NE>.15)glows.push([sx+(green?7:-7),sy-47,26,green?'rgba(42,255,109,.5)':'rgba(255,42,42,.5)']);
   continue;
  }
  if(o.k==='chochin'){
   const sx=Math.round(o.x*T-camX),sy=Math.round(o.y*T-camY-38+Math.sin(t*2+o.x)*2);
   rect(g,sx-5,sy-8,10,14,'#e62e25');rect(g,sx-3,sy-5,6,8,'#ffcf6a');
   if(NE>.15)glows.push([sx,sy,42,'rgba(255,150,70,.55)']);
   continue;
  }
  if(o.k==='skybridge'){
   const sx=Math.round(o.x*T-camX),sy=Math.round(o.y*T-camY-72),sw=Math.round(o.w*T);
   rect(g,sx,sy,sw,20,'#2b384c');rect(g,sx+2,sy+3,sw-4,12,'#6ba8d8');
   for(let q=0;q<sw;q+=12)rect(g,sx+q,sy,2,20,'#dce4ee');
   continue;
  }
  const s=spr[o.k];if(!s)continue;
  const dx=Math.round(o.x*T+T*o.w/2-s.width/2-camX),dy=Math.round((o.y+o.h)*T-s.height-camY);
  g.drawImage(s,dx,dy);
  if(o.k==='konbini')glows.push([dx+s.width/2,dy+s.height/2,160,'rgba(255,245,210,.55)']);
  if(o.k==='tokyotower')glows.push([dx+s.width/2,dy+s.height*.55,220,'rgba(255,120,40,.65)']);
  if(o.k==='qfront'||o.k==='tower109'||o.k==='tsutaya')glows.push([dx+s.width/2,dy+45,150,'rgba(255,90,120,.5)']);
 }

 // Tiang lampu jalan, Kabel Utilitas, Antena Atap & Papan Neon Vertikal Kabukicho
 drawUtilityWires(g,camX,camY);
 for(const l of LAMPS){

   if(x<-r||x>W+r||y<-r||y>H+r)continue;
   const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
   g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
 }
 drawWeather(g,dt,camX,camY);
 // Pin navigasi waypoint
 if(PIN){
  const px=PIN.x*T-camX,py=PIN.y*T-camY,m=20;
  if(px>m&&px<W-m&&py>m&&py<H-m){disc(g,px,py-26+Math.sin(t*4)*3,7,'#ffd23f')}
  else{const cx=Math.min(W-m,Math.max(m,px)),cy=Math.min(H-m,Math.max(m+30,py));disc(g,cx,cy,8,'#ffd23f');g.fillStyle='#1a1200';g.font='bold 9px system-ui,sans-serif';g.textAlign='center';g.fillText(Math.round(Math.hypot(PIN.x-Pl.x,PIN.y-Pl.y))+'m',cx,cy+3)}
 }
}

/* =====================================================================
   LOOP UTAMA & KONTROL HUD
   ===================================================================== */
function resize(){DPR=window.devicePixelRatio||1;const cw=innerWidth*DPR,ch=innerHeight*DPR;K=Math.max(1,Math.floor(ch/384));H=384;W=Math.max(Math.round(H*4/3),Math.floor(cw/K));cv.width=W;cv.height=H;cv.style.width=(W*K/DPR)+'px';cv.style.height=(H*K/DPR)+'px'}
addEventListener('resize',resize);
function setTod(i){tod=i;document.querySelectorAll('#gt button').forEach(b=>b.classList.toggle('on',+b.dataset.t===i))}
document.getElementById('gt').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTod(+b.dataset.t)});
const WXN=['Otomatis','Cerah','Kabut','Hujan'];
document.getElementById('wxb').addEventListener('click',e=>{wxMode=wxMode>=2?-1:wxMode+1;e.target.textContent='Cuaca: '+WXN[wxMode+1];e.target.classList.toggle('on',wxMode>=0)});
document.getElementById('fxb').addEventListener('click',e=>{FX=!FX;e.target.textContent='Efek '+(FX?'ON':'OFF');e.target.classList.toggle('on',FX)});

const info=document.getElementById('info'),lvEl=document.getElementById('lv'),fr=[];let last=performance.now(),lastInfo=0;
function loop(now){
 let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
 fr.push(dt*1000);if(fr.length>120)fr.shift();
 const t=now/1000;
 step(dt);updOthers(dt);updTrain(dt);updCars(dt,t);updPeds(dt,t);updZone();
 render(t,dt);drawMapLayer(mx,MS,t,false);sndFoot();sndUpdate(t);updAct();
 if(now-lastInfo>400){
  lastInfo=now;const avg=fr.reduce((a,b)=>a+b,0)/fr.length;
  info.innerHTML='<b>Kota Besar · Tokyo</b><br>FPS <b>'+(1000/avg).toFixed(0)+'</b> · layar logika '+W+'x'+H+' · skala x'+K;
  lvEl.innerHTML=clockText()+'<br>'+(PIN?'📍 '+PIN.n+' ('+Math.round(Math.hypot(PIN.x-Pl.x,PIN.y-Pl.y))+'p)':'ketuk untuk peta');
 }
 requestAnimationFrame(loop);
}

function boot(){
 resize();setTod(-1);
 const lbar=document.getElementById('lbar'),ltx=document.getElementById('ltx');
 if(lbar)lbar.style.width='50%';if(ltx)ltx.textContent='Membangun Shibuya & Kabukicho';
 bakeGround();bakeSprites();
 if(GATE){
  const l=document.getElementById('load');if(l)l.remove();
  const gt=document.getElementById('gate');document.getElementById('gmsg').innerHTML=GATE+'<br><a href="'+BACK+'">⬅ Kembali ke game</a>';gt.style.display='flex';return;
 }
 setInterval(presTick,1000);setInterval(getOthers,1500);setInterval(netShow,500);
 Promise.race([Promise.all([presTick(),getOthers()]),new Promise(r=>setTimeout(r,1800))]).then(()=>{
  if(lbar)lbar.style.width='100%';
  const l=document.getElementById('load');if(l){l.classList.add('out');setTimeout(()=>l.remove(),500)}
  setTimeout(()=>toast('🚉 Tiba di Stasiun Kota Besar Tokyo!'),900);
 });
 requestAnimationFrame(loop);
}
requestAnimationFrame(()=>setTimeout(boot,40));
</script>
